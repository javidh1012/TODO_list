<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceTask | 5-Mode UI</title>
    <style>
        :root { --primary: #2563eb; --bg: #f1f5f9; --error: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 450px; background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        
        /* Visual Interaction: Feedback Cues */
        .mic-container { margin: 20px 0; }
        .btn-voice { 
            background: #64748b; color: white; border: none; padding: 15px 30px; 
            border-radius: 50px; cursor: pointer; font-weight: bold; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
        }
        .listening { background: var(--error) !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .task-item { background: #f8fafc; padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; justify-content: space-between; border-left: 4px solid var(--primary); }
        .toast { position: fixed; bottom: 20px; background: #333; color: white; padding: 12px 24px; border-radius: 50px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>SmartTask Voice</h1>
    
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <input type="text" id="taskInput" placeholder="Type or use voice..." style="flex:1; padding:12px; border-radius:10px; border:1px solid #ddd;">
        <button id="addBtn" style="background:var(--primary); color:white; border:none; padding:12px; border-radius:10px; cursor:pointer;">Add</button>
    </div>

    <div class="mic-container">
        <button class="btn-voice" id="voiceBtn">
            <span id="micIcon">🎤</span> <span id="voiceStatus">Click to Speak</span>
        </button>
        <p style="font-size: 0.8rem; color: #64748b; margin-top: 10px;">Commands: "Add Task" | "Clear All"</p>
    </div>

    <ul id="taskList" style="list-style:none; padding:0; text-align:left;"></ul>
</div>

<div id="toast" class="toast"></div>

<script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceStatus = document.getElementById('voiceStatus');

    function addTask(manualText) {
        const text = manualText || taskInput.value.trim();
        if (!text) return;
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `<span>${text}</span><button onclick="this.parentElement.remove()" style="background:none; border:none; cursor:pointer;">❌</button>`;
        taskList.prepend(li);
        taskInput.value = "";
        showToast(`Success: "${text}" added`);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    }

    // Interactions
    document.getElementById('addBtn').onclick = () => addTask();
    taskInput.onkeypress = (e) => { if(e.key === 'Enter') addTask(); };

    // Voice Engine
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false; // Stops after one command for better control
        recognition.lang = 'en-US';

        voiceBtn.onclick = () => {
            try {
                recognition.start();
            } catch (e) {
                console.log("Recognition already started");
            }
        };

        recognition.onstart = () => {
            voiceBtn.classList.add('listening');
            voiceStatus.innerText = "Listening...";
        };

        recognition.onresult = (event) => {
            const result = event.results[0][0].transcript.toLowerCase();
            if (result.includes("clear all")) {
                taskList.innerHTML = "";
                showToast("List cleared via voice");
            } else if (result.includes("add task") || result.length > 0) {
                // If they say "Add Task [Subject]", we strip the command
                const cleanText = result.replace("add task", "").trim();
                addTask(cleanText || "New Voice Task");
            }
        };

        recognition.onerror = (err) => {
            if (err.error === 'not-allowed') {
                alert("Microphone Access Denied. To fix: \n1. Use HTTPS (GitHub Pages)\n2. Click the 'Lock' icon in the URL bar and Allow Microphone.");
            }
            stopUI();
        };

        recognition.onend = () => stopUI();

        function stopUI() {
            voiceBtn.classList.remove('listening');
            voiceStatus.innerText = "Click to Speak";
        }
    } else {
        voiceStatus.innerText = "Voice Not Supported";
    }
</script>
</body>
</html>
